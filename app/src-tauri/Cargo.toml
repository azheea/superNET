[package]
name = "supernet-app"
description = "superNET desktop and mobile app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "supernet_app"
# staticlib/cdylib: the Android (and iOS) app loads the Rust side as a library.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
supernet-core = { path = "../../crates/supernet-core" }
supernet-control = { path = "../../crates/supernet-control" }
supernet-sysproxy = { path = "../../crates/supernet-sysproxy" }
supernet-tun = { path = "../../crates/supernet-tun" }
supernet-netstack = { path = "../../crates/supernet-netstack" }
supernet-mesh = { path = "../../crates/supernet-mesh" }
tauri = { version = "2", features = [] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
