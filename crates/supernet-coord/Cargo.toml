[package]
name = "supernet-coord"
description = "superNET virtual network coordinator (runs on the user's server)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "supernet-coord"
path = "src/main.rs"

[dependencies]
# Without the device side: no C code, so it links statically for Linux.
supernet-mesh = { path = "../supernet-mesh", default-features = false }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
