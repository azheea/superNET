# Build every platform and, for a v* tag, publish a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0     -> builds + Release "v0.1.0"
#   Actions -> release -> Run workflow             -> builds only (artifacts)
#
# Android release signing uses these repository secrets when present
# (otherwise the APKs are debug-signed, installable but not upgradable to a
# signed build without uninstalling):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# Caches:
#   - Swatinem/rust-cache: dependencies (target/, ~/.cargo). Saved by branch
#     and manual runs only: a tag's caches are visible to that tag alone.
#   - sccache (GitHub Actions cache backend): the workspace's own crates,
#     which rust-cache leaves out. Skipped where sccache is unavailable.
#   - npm (setup-node), Gradle (setup-java), apt packages (Linux).
#   Full LTO (Cargo.toml) still runs on every build; it cannot be cached.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64, target: x86_64-pc-windows-msvc, wintun: amd64 }
          - { runner: windows-11-arm, arch: arm64, target: aarch64-pc-windows-msvc, wintun: arm64 }
          - { runner: windows-latest, arch: x86, target: i686-pc-windows-msvc, wintun: x86 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.arch }}", cache-on-failure: true, save-if: "${{ !startsWith(github.ref, 'refs/tags/') }}" }
      - name: sccache (workspace crates)
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Use sccache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: App and CLI
        run: |
          cargo build --release --target ${{ matrix.target }} -p supernet-app --features tauri/custom-protocol
          cargo build --release --target ${{ matrix.target }} -p supernet-cli
      - name: wintun.dll (verified hash and signature)
        shell: pwsh
        run: ./scripts/fetch-wintun.ps1 -Arch ${{ matrix.wintun }}
      - name: Package
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          $d = New-Item -ItemType Directory -Force out/superNET-windows-${{ matrix.arch }}
          Copy-Item "$bin/supernet-app.exe" "$d/superNET.exe"
          # Not "supernet.exe": Windows file names ignore case, that would replace superNET.exe.
          Copy-Item "$bin/supernet.exe" "$d/supernet-cli.exe"
          Copy-Item local/wintun/wintun.dll, local/wintun/LICENSE.txt $d
          Rename-Item "$d/LICENSE.txt" wintun-LICENSE.txt
          if (Test-Path "$bin/WebView2Loader.dll") { Copy-Item "$bin/WebView2Loader.dll" $d }
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $d
          $names = (Get-ChildItem $d).Name
          foreach ($n in 'superNET.exe', 'supernet-cli.exe', 'wintun.dll') { if ($names -notcontains $n) { throw "missing $n" } }
          if ((Get-Item "$d/superNET.exe").Length -eq (Get-Item "$d/supernet-cli.exe").Length) { throw 'superNET.exe and supernet-cli.exe are the same file' }
          Compress-Archive -Path "$d/*" -DestinationPath out/superNET-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with: { name: "windows-${{ matrix.arch }}", path: "out/superNET-windows-${{ matrix.arch }}.zip", if-no-files-found: error }

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.arch }}-unknown-linux-musl" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.arch }}", cache-on-failure: true, save-if: "${{ !startsWith(github.ref, 'refs/tags/') }}" }
      - name: sccache (workspace crates)
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Use sccache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Build dependencies (cached)
        id: apt
        continue-on-error: true
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: build-essential pkg-config libssl-dev musl-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          version: "1-${{ matrix.arch }}"
      - name: Build dependencies (apt, if the cache step failed)
        if: steps.apt.outcome != 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev musl-tools \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Frontend
        working-directory: app
        run: npm ci && npm run build
      - name: Desktop app (.deb with supernet-cli)
        run: ./scripts/build-linux-app.sh
      - name: Static CLI and coordinator (musl)
        env:
          TARGET: ${{ matrix.arch }}-unknown-linux-musl
        run: |
          export CC_${TARGET//-/_}=musl-gcc
          cargo build --release --target "$TARGET" -p supernet-cli -p supernet-coord
      - name: Package
        run: |
          mkdir -p out
          cp dist/linux/*.deb out/
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/supernet out/supernet-linux-${{ matrix.arch }}
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/supernet-coord out/supernet-coord-linux-${{ matrix.arch }}
          file out/*
      - uses: actions/upload-artifact@v4
        with: { name: "linux-${{ matrix.arch }}", path: out/*, if-no-files-found: error }

  # 32-bit ARM (Raspberry Pi OS 32-bit, routers, NAS): the static CLI and the
  # coordinator, cross-built with Zig, then run once under QEMU.
  linux-armv7:
    runs-on: ubuntu-22.04
    env:
      TARGET: armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: armv7-unknown-linux-musleabihf }
      - uses: Swatinem/rust-cache@v2
        with: { key: armv7, cache-on-failure: true, save-if: "${{ !startsWith(github.ref, 'refs/tags/') }}" }
      - name: Frontend (embedded in the CLI's web console)
        working-directory: app
        run: npm ci && npm run build
      - name: Zig and cargo-zigbuild
        run: pip3 install --user ziglang cargo-zigbuild
      - name: Static CLI and coordinator
        run: cargo zigbuild --release --target "$TARGET" -p supernet-cli -p supernet-coord
      - name: Package and smoke test (QEMU)
        run: |
          mkdir -p out
          cp target/$TARGET/release/supernet out/supernet-linux-armv7
          cp target/$TARGET/release/supernet-coord out/supernet-coord-linux-armv7
          file out/*
          sudo apt-get update && sudo apt-get install -y qemu-user-static
          qemu-arm-static out/supernet-linux-armv7 --help | head -3
          qemu-arm-static out/supernet-coord-linux-armv7 help | head -2
      - uses: actions/upload-artifact@v4
        with: { name: linux-armv7, path: out/*, if-no-files-found: error }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true, save-if: "${{ !startsWith(github.ref, 'refs/tags/') }}" }
      - name: sccache (workspace crates)
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Use sccache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Frontend
        working-directory: app
        run: npm ci && npm run build
      - name: Universal app
        working-directory: app
        run: npx tauri build --target universal-apple-darwin --bundles app
      - name: Universal CLI
        run: |
          cargo build --release --target aarch64-apple-darwin -p supernet-cli
          cargo build --release --target x86_64-apple-darwin -p supernet-cli
          mkdir -p out
          lipo -create -output out/supernet-macos-universal \
            target/aarch64-apple-darwin/release/supernet target/x86_64-apple-darwin/release/supernet
      - name: Package (app with supernet-cli inside, zip and dmg)
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/superNET.app
          # Not "supernet": macOS file systems ignore case, that is the app's own binary.
          cp out/supernet-macos-universal "$app/Contents/MacOS/supernet-cli"
          codesign --force --deep -s - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" out/superNET-macos-universal.zip
          mkdir -p dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname superNET -srcfolder dmg -ov -format UDZO out/superNET-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/*, if-no-files-found: error }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            app/src-tauri/gen/android/**/*.gradle*
            app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true, save-if: "${{ !startsWith(github.ref, 'refs/tags/') }}" }
      - name: sccache (workspace crates)
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Use sccache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Android SDK packages
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          # compileSdk 37 (the package is "android-37.0" in newer SDK repositories).
          "$sdk" "platforms;android-37.0" > /dev/null || "$sdk" "platforms;android-37" > /dev/null
          "$sdk" "build-tools;36.0.0" "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Release signing key (from secrets, if set)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p local
            echo "$KEYSTORE" | base64 -d > local/android-release.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PWD/local/android-release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > local/android-keystore.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building debug-signed APKs"
          fi
      - name: Frontend
        working-directory: app
        run: npm ci
      - name: APKs
        working-directory: app
        run: |
          if [ "$SIGNED" = 1 ]; then
            npx tauri android build --apk --split-per-abi --target aarch64 --target armv7 --target x86_64
          else
            npx tauri android build --apk --split-per-abi --debug --target aarch64 --target armv7 --target x86_64
          fi
      - name: Package
        run: |
          mkdir -p out
          kind=$([ "$SIGNED" = 1 ] && echo release || echo debug)
          # Gradle flavour -> published name ("arm" is 32-bit armeabi-v7a; exact names, "arm" is a prefix of "arm64").
          for pair in arm64:arm64 arm:armv7 x86_64:x86_64; do
            flavor=${pair%%:*}; name=${pair##*:}
            f=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "app-${flavor}-${kind}.apk" | head -1)
            [ -n "$f" ] || { echo "no $flavor APK"; find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk'; exit 1; }
            cp "$f" "out/superNET-android-${name}$([ "$kind" = debug ] && echo -debug).apk"
          done
          rm -f local/android-release.jks local/android-keystore.properties
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*, if-no-files-found: error }

  # iOS: compiled to catch breakage; not released (installing needs a paid
  # Apple Developer account to sign the Network Extension, see ios/README.md).
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true, save-if: "${{ !startsWith(github.ref, 'refs/tags/') }}" }
      - name: sccache (workspace crates)
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Use sccache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: App and Packet Tunnel extension (ad-hoc signed)
        run: |
          ./ios/build.sh device
          codesign --verify --deep --strict build/ios/device/superNET.app
      - uses: actions/upload-artifact@v4
        with: { name: ios-unsigned, path: build/ios/device/superNET.ipa, if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, linux-armv7, macos, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          v=$(python3 -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")
          if [ "v$v" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} but tauri.conf.json says $v: bump Cargo.toml, tauri.conf.json and package.json first"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect files and checksums
        run: |
          mkdir -p release
          find artifacts -type f ! -path 'artifacts/ios-unsigned/*' -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          ## 下载

          | 平台 | 文件 |
          |---|---|
          | Windows | `superNET-windows-x64.zip`（Intel / AMD 64 位）/ `superNET-windows-arm64.zip`（骁龙等 ARM 电脑）/ `superNET-windows-x86.zip`（32 位系统）：解压后运行 `superNET.exe`（命令行版是 `supernet-cli.exe`）。TUN 模式需要管理员权限，`wintun.dll` 已附带 |
          | macOS（Apple 芯片和 Intel） | `superNET-macos-universal.dmg`。未公证，第一次请右键选“打开”。TUN 和组网用应用包里的 `supernet-cli`（需要 sudo） |
          | Linux 桌面 | `superNET_*_amd64.deb` / `superNET_*_arm64.deb`：`sudo apt install ./superNET_*.deb` |
          | Linux 服务器 | `supernet-linux-x86_64` / `supernet-linux-aarch64` / `supernet-linux-armv7`（32 位树莓派、路由器）：静态程序，`sudo ./supernet-linux-x86_64 join 邀请链接 --install-service` |
          | 协调服务 | `supernet-coord-linux-x86_64` / `supernet-coord-linux-aarch64` / `supernet-coord-linux-armv7` |
          | Android | `superNET-android-arm64*.apk`（大多数手机）/ `superNET-android-armv7*.apk`（老的 32 位手机）/ `superNET-android-x86_64*.apk`（模拟器） |

          iOS 需要自己用付费开发者账号签名，见 [ios/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/ios/README.md)。

          校验：`SHA256SUMS.txt`。用法见 [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md)。
          EOF
          sed -i 's/^          //' notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" --title "superNET ${{ github.ref_name }}" --notes-file notes.md
