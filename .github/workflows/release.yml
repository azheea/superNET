# Build every platform and, for a v* tag, publish a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0     -> builds + Release "v0.1.0"
#   Actions -> release -> Run workflow             -> builds only (artifacts)
#
# Android release signing uses these repository secrets when present
# (otherwise the APKs are debug-signed, installable but not upgradable to a
# signed build without uninstalling):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: App and CLI
        run: |
          cargo build --release -p supernet-app --features tauri/custom-protocol
          cargo build --release -p supernet-cli
      - name: wintun.dll (verified hash and signature)
        shell: pwsh
        run: ./scripts/fetch-wintun.ps1
      - name: Package
        shell: pwsh
        run: |
          $d = New-Item -ItemType Directory -Force out/superNET-windows-x64
          Copy-Item target/release/supernet-app.exe "$d/superNET.exe"
          # Not "supernet.exe": Windows file names ignore case, that would replace superNET.exe.
          Copy-Item target/release/supernet.exe "$d/supernet-cli.exe"
          Copy-Item local/wintun/wintun.dll, local/wintun/LICENSE.txt $d
          Rename-Item "$d/LICENSE.txt" wintun-LICENSE.txt
          if (Test-Path target/release/WebView2Loader.dll) { Copy-Item target/release/WebView2Loader.dll $d }
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $d
          $names = (Get-ChildItem $d).Name
          foreach ($n in 'superNET.exe', 'supernet-cli.exe', 'wintun.dll') { if ($names -notcontains $n) { throw "missing $n" } }
          if ((Get-Item "$d/superNET.exe").Length -eq (Get-Item "$d/supernet-cli.exe").Length) { throw 'superNET.exe and supernet-cli.exe are the same file' }
          Compress-Archive -Path "$d/*" -DestinationPath out/superNET-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/superNET-windows-x64.zip, if-no-files-found: error }

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.arch }}-unknown-linux-musl" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.arch }}" }
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev musl-tools \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Frontend
        working-directory: app
        run: npm ci && npm run build
      - name: Desktop app (.deb with supernet-cli)
        run: ./scripts/build-linux-app.sh
      - name: Static CLI and coordinator (musl)
        env:
          TARGET: ${{ matrix.arch }}-unknown-linux-musl
        run: |
          export CC_${TARGET//-/_}=musl-gcc
          cargo build --release --target "$TARGET" -p supernet-cli -p supernet-coord
      - name: Package
        run: |
          mkdir -p out
          cp dist/linux/*.deb out/
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/supernet out/supernet-linux-${{ matrix.arch }}
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/supernet-coord out/supernet-coord-linux-${{ matrix.arch }}
          file out/*
      - uses: actions/upload-artifact@v4
        with: { name: "linux-${{ matrix.arch }}", path: out/*, if-no-files-found: error }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - name: Frontend
        working-directory: app
        run: npm ci && npm run build
      - name: Universal app
        working-directory: app
        run: npx tauri build --target universal-apple-darwin --bundles app
      - name: Universal CLI
        run: |
          cargo build --release --target aarch64-apple-darwin -p supernet-cli
          cargo build --release --target x86_64-apple-darwin -p supernet-cli
          mkdir -p out
          lipo -create -output out/supernet-macos-universal \
            target/aarch64-apple-darwin/release/supernet target/x86_64-apple-darwin/release/supernet
      - name: Package (app with supernet-cli inside, zip and dmg)
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/superNET.app
          # Not "supernet": macOS file systems ignore case, that is the app's own binary.
          cp out/supernet-macos-universal "$app/Contents/MacOS/supernet-cli"
          codesign --force --deep -s - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" out/superNET-macos-universal.zip
          mkdir -p dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname superNET -srcfolder dmg -ov -format UDZO out/superNET-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/*, if-no-files-found: error }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - name: Android SDK packages
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          # compileSdk 37 (the package is "android-37.0" in newer SDK repositories).
          "$sdk" "platforms;android-37.0" > /dev/null || "$sdk" "platforms;android-37" > /dev/null
          "$sdk" "build-tools;36.0.0" "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Release signing key (from secrets, if set)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p local
            echo "$KEYSTORE" | base64 -d > local/android-release.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PWD/local/android-release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > local/android-keystore.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building debug-signed APKs"
          fi
      - name: Frontend
        working-directory: app
        run: npm ci
      - name: APKs
        working-directory: app
        run: |
          if [ "$SIGNED" = 1 ]; then
            npx tauri android build --apk --split-per-abi --target aarch64 --target x86_64
          else
            npx tauri android build --apk --split-per-abi --debug --target aarch64 --target x86_64
          fi
      - name: Package
        run: |
          mkdir -p out
          kind=$([ "$SIGNED" = 1 ] && echo release || echo debug)
          for abi in arm64 x86_64; do
            f=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*${abi}*${kind}*.apk" | head -1)
            [ -n "$f" ] || { echo "no $abi APK"; find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk'; exit 1; }
            cp "$f" "out/superNET-android-${abi}$([ "$kind" = debug ] && echo -debug).apk"
          done
          rm -f local/android-release.jks local/android-keystore.properties
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*, if-no-files-found: error }

  # iOS: compiled to catch breakage; not released (installing needs a paid
  # Apple Developer account to sign the Network Extension, see ios/README.md).
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - uses: Swatinem/rust-cache@v2
      - name: App and Packet Tunnel extension (ad-hoc signed)
        run: |
          ./ios/build.sh device
          codesign --verify --deep --strict build/ios/device/superNET.app
      - uses: actions/upload-artifact@v4
        with: { name: ios-unsigned, path: build/ios/device/superNET.ipa, if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect files and checksums
        run: |
          mkdir -p release
          find artifacts -type f ! -path 'artifacts/ios-unsigned/*' -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          ## 下载

          | 平台 | 文件 |
          |---|---|
          | Windows x64 | `superNET-windows-x64.zip`：解压后运行 `superNET.exe`（命令行版是 `supernet-cli.exe`）。TUN 模式需要管理员权限，`wintun.dll` 已附带 |
          | macOS（Apple 芯片和 Intel） | `superNET-macos-universal.dmg`。未公证，第一次请右键选“打开”。TUN 和组网用应用包里的 `supernet-cli`（需要 sudo） |
          | Linux 桌面 | `superNET_*_amd64.deb` / `superNET_*_arm64.deb`：`sudo apt install ./superNET_*.deb` |
          | Linux 服务器 | `supernet-linux-x86_64` / `supernet-linux-aarch64`：静态程序，`sudo ./supernet-linux-x86_64 join 邀请链接 --install-service` |
          | 协调服务 | `supernet-coord-linux-x86_64` / `supernet-coord-linux-aarch64` |
          | Android | `superNET-android-arm64*.apk`（手机）/ `superNET-android-x86_64*.apk`（模拟器） |

          iOS 需要自己用付费开发者账号签名，见 [ios/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/ios/README.md)。

          校验：`SHA256SUMS.txt`。用法见 [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md)。
          EOF
          sed -i 's/^          //' notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" --title "superNET ${{ github.ref_name }}" --notes-file notes.md
