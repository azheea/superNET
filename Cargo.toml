[workspace]
resolver = "2"
exclude = ["vendor/smoltcp"]
members = [
    "crates/supernet-core",
    "crates/supernet-wg",
    "crates/supernet-sysproxy",
    "crates/supernet-testnode",
    "crates/supernet-cli",
    "crates/supernet-hy2",
    "crates/supernet-netstack",
    "crates/supernet-tun",
    "crates/supernet-mesh",
    "crates/supernet-coord",
    "crates/supernet-ffi",
    "crates/supernet-control",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

# Local fix for a TCP stall; see vendor/smoltcp/SUPERNET-PATCH.md.
[patch.crates-io]
smoltcp = { path = "vendor/smoltcp" }
